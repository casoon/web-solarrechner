name = "web-solarrechner"
main = "./src/worker.ts"
workers_dev = false
preview_urls = false
# Newest date supported by the installed workerd; no tooling upgrade required.
compatibility_date = "2026-10-26"
compatibility_flags = ["nodejs_compat", "no_handle_cross_request_promise_resolution"]

[[routes]]
pattern = "solarrechner.casoon.de"
custom_domain = true

[assets]
html_handling = "force-trailing-slash"
# HTML pages go through src/worker.ts, which compresses them itself (see there).
run_worker_first = ["/", "/about/*", "/de/*"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# PVGIS proxy (src/pages/api/solar.ts): only cache misses count. Per client and in total per
# Cloudflare location, so one script cannot get the egress address blocked at PVGIS.
[[ratelimits]]
name = "PVGIS_PER_CLIENT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PVGIS_TOTAL"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60
