packages:
  - "apps/*"

# Build scripts are reviewed: allowBuilds is pnpm 11's replacement for
# onlyBuiltDependencies / ignoredBuiltDependencies.
allowBuilds:
  "@casoon/astro-post-audit": true
  esbuild: true
  sharp: true
  workerd: true

# A new version installs only after it has been public for a day.
minimumReleaseAge: 1440

# GHSA-gcqx-w48m-w2h4 (deepmerge <=4.3.1, low): no patched release on npm. The only path is
# @sveltejs/vite-plugin-svelte merging the project's own Svelte config at build time, so no
# untrusted input reaches it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

# Transitive dependencies pinned to patched versions (pnpm audit), all dev/build-time-only
# tooling (astro's asset pipeline, @astrojs/internal-helpers, vite/postcss,
# satori, and wrangler/miniflare's own sharp resolution).
overrides:
  fast-uri: ^3.1.9
  nanoid: ^3.3.18
  fflate: ^0.7.5
  svgo: ^4.1.0
  "undici@7": ^7.30.1
  sharp: ^0.35.5

catalog:
  # Astro v7 (stable)
  astro: ^7.4.2
  "@astrojs/check": ^0.9.12
  "@astrojs/cloudflare": ^14.4.2
  "@astrojs/svelte": ^9.1.1
  "@axe-core/playwright": ^4.14.0
  "@casoon/astro-post-audit": ^0.9.3
  "@casoon/astro-site-files": ^0.7.1
  "@casoon/astro-speed-measure": ^0.4.0
  "@casoon/astro-structured-data": ^2.3.1

  # Tailwind v4
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3

  # Svelte 5
  svelte: ^5.57.2

  # Build and tests
  "@types/node": ^24.0.0
  tsx: ^4.23.15
  typescript: ^6.0.3
  satori: ^0.63.2
  "@resvg/resvg-js": ^2.6.2
  sharp: ^0.35.5

  # Code analysis
  fallow: ^3.35.0

  # Deployment
  wrangler: ^4.152.0

  # Formatting & Linting
  "@biomejs/biome": ^2.6.3
  husky: ^9.1.7
  lint-staged: ^17.6.0

  # Fonts
  "@fontsource/inter": ^5.3.0
